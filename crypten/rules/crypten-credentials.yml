# crypTen custom Semgrep rules for credential-handling weaknesses.
#
# These are the reusable survey rules named in the project proposal. They run
# fully offline:
#
#   semgrep --config crypten/rules/crypten-credentials.yml <target>
#
# Each rule maps to a CWE in the project's scope and pairs with an AST rule in
# crypten/scanners/ast_rules.py. Semgrep matches syntactic shapes within a file;
# the AST rules add name-aware context across a function. Running both and
# merging is deliberate - agreement between them raises a finding's score.

rules:
  - id: crypten-md5-password
    languages: [python]
    severity: ERROR
    message: >
      Password hashed with a fast general-purpose digest (MD5/SHA-1). Use
      Argon2id, which is memory-hard and salts each password. [CWE-916]
    metadata:
      cwe: "CWE-916"
      owasp: "A04:2025 Cryptographic Failures"
    patterns:
      - pattern-either:
          - pattern: hashlib.md5($ARG)
          - pattern: hashlib.sha1($ARG)
      - metavariable-regex:
          metavariable: $ARG
          regex: (?i).*(password|passwd|pwd|passphrase|secret).*

  - id: crypten-jwt-signature-not-verified
    languages: [python]
    severity: ERROR
    message: >
      JWT decoded without verifying its signature. An attacker can forge a token
      for any user or role. Decode with a key and algorithms=["HS256"]. [CWE-347]
    metadata:
      cwe: "CWE-347"
      owasp: "A07:2025 Authentication Failures"
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
      - pattern: "jwt.decode(..., verify=False, ...)"
      - pattern: 'jwt.decode(..., algorithms=["none"], ...)'
      - pattern: 'jwt.decode(..., algorithms=[..., "none", ...], ...)'

  - id: crypten-credential-in-log
    languages: [python]
    severity: WARNING
    message: >
      A password or token is written to the application log. Secrets in logs
      escape the protected store into less-guarded log storage. Log the
      identifier only. [CWE-532]
    metadata:
      cwe: "CWE-532"
      owasp: "A09:2025 Logging and Alerting Failures"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: logging.$METHOD(..., $ARG, ...)
              - pattern: $LOGGER.$METHOD(..., $ARG, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(debug|info|warning|warn|error|exception|critical|log)$
          - metavariable-regex:
              metavariable: $ARG
              regex: (?i).*(password|passwd|pwd|secret|token|api_key).*
      - patterns:
          - pattern: print(..., $ARG, ...)
          - metavariable-regex:
              metavariable: $ARG
              regex: (?i).*(password|passwd|pwd|secret|token|api_key).*

  - id: crypten-random-for-token
    languages: [python]
    severity: ERROR
    message: >
      Security-relevant value generated with the non-cryptographic random
      module. Its state is reconstructible from observed output. Use
      secrets.token_urlsafe(32). [CWE-330]
    metadata:
      cwe: "CWE-330"
      owasp: "A07:2025 Authentication Failures"
    pattern-either:
      - pattern: random.choice(...)
      - pattern: random.choices(...)
      - pattern: random.randint(...)
      - pattern: random.randrange(...)
      - pattern: random.getrandbits(...)
      - pattern: random.sample(...)
      - pattern: random.random()

  - id: crypten-tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: >
      TLS certificate verification disabled on an outbound request. Any party on
      the network path can intercept the traffic. Remove verify=False. [CWE-295]
    metadata:
      cwe: "CWE-295"
      owasp: "A04:2025 Cryptographic Failures"
    pattern-either:
      - pattern: requests.get(..., verify=False, ...)
      - pattern: requests.post(..., verify=False, ...)
      - pattern: requests.put(..., verify=False, ...)
      - pattern: requests.delete(..., verify=False, ...)
      - pattern: requests.patch(..., verify=False, ...)
      - pattern: requests.head(..., verify=False, ...)
      - pattern: requests.request(..., verify=False, ...)
